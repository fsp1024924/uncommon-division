services:
  uncommon-division:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uncommon-division
    ports:
      - "3040:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
